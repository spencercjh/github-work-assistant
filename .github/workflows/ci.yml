name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make check build test
      - name: Fresh SQLite installation without Docker
        run: python3 scripts/smoke-setup.py --database sqlite
      - name: Build and exercise the pure-Go SQLite driver
        run: CGO_ENABLED=0 go test ./internal/database
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
        env:
          MYSQL_DATABASE: assistant_test
          MYSQL_USER: assistant
          MYSQL_PASSWORD: disposable-test-password
          MYSQL_ROOT_PASSWORD: disposable-root-password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Database and delivery integration
        env:
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          umask 077
          printf 'assistant:disposable-test-password@tcp(127.0.0.1:%s)/assistant_test?charset=utf8mb4&timeout=5s\n' "$DB_PORT" > "$RUNNER_TEMP/ghraft-test-dsn"
          GHRAFT_TEST_DRIVER=mysql GHRAFT_TEST_DSN_FILE="$RUNNER_TEMP/ghraft-test-dsn" make integration
      - name: Fresh installation smoke test
        run: python3 scripts/smoke-setup.py --database mysql
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_DB: assistant_test
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: disposable-test-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U assistant -d assistant_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Database and delivery integration
        env:
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          umask 077
          printf 'postgres://assistant:disposable-test-password@127.0.0.1:%s/assistant_test?sslmode=disable\n' "$DB_PORT" > "$RUNNER_TEMP/ghraft-test-dsn"
          GHRAFT_TEST_DRIVER=postgres GHRAFT_TEST_DSN_FILE="$RUNNER_TEMP/ghraft-test-dsn" make integration
      - name: Fresh installation with an existing PostgreSQL database
        env:
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$DB_CONTAINER" createdb -U assistant assistant_smoke_test
          umask 077
          printf 'postgres://assistant:disposable-test-password@127.0.0.1:%s/assistant_smoke_test?sslmode=disable\n' "$DB_PORT" > "$RUNNER_TEMP/ghraft-smoke-dsn"
          python3 scripts/smoke-setup.py --database postgres --dsn-file "$RUNNER_TEMP/ghraft-smoke-dsn"
